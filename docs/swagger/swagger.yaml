info:
  contact:
    email: artalkjs@gmail.com
    name: API Support
    url: https://artalk.js.org
  description: Artalk is a modern comment system based on Golang.
  license:
    name: MIT
    url: https://github.com/ArtalkJS/Artalk/blob/master/LICENSE
  title: Artalk API
  version: "2.0"
paths:
  /auth/email/login:
    post:
      consumes:
      - application/json
      description: Login by email with verify code (Need send email verify code first)
        or password
      operationId: LoginByEmail
      parameters:
      - description: The data to login
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/handler.RequestAuthEmailLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ResponseUserLogin'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
      summary: Login by email
      tags:
      - Auth
  /auth/email/register:
    post:
      consumes:
      - application/json
      description: Register by email and verify code (if user exists, will update
        user, like forget or change password. Need send email verify code first)
      operationId: RegisterByEmail
      parameters:
      - description: The data to register
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/handler.RequestAuthEmailRegister'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ResponseUserLogin'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
      summary: Register by email
      tags:
      - Auth
  /auth/email/send:
    post:
      consumes:
      - application/json
      description: Send email including verify code to user
      operationId: SendVerifyEmail
      parameters:
      - description: The data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/handler.RequestAuthEmailSend'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
      summary: Send verify email
      tags:
      - Auth
  /auth/merge:
    get:
      description: Get all users with same email, if there are more than one user
        with same email, need merge
      operationId: CheckDataMerge
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ResponseAuthDataMergeCheck'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: Check data merge
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: This function is to solve the problem of multiple users with the
        same email address, should be called after user login and then check, and
        perform data merge.
      operationId: ApplyDataMerge
      parameters:
      - description: The data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/handler.RequestAuthDataMergeApply'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ResponseAuthDataMergeApply'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: Apply data merge
      tags:
      - Auth
  /cache/flush:
    post:
      description: Flush all cache on the server
      operationId: FlushCache
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: Flush Cache
      tags:
      - Cache
  /cache/warm_up:
    post:
      description: Cache warming helps you to pre-load the cache to improve the performance
        of the first request
      operationId: WarmUpCache
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: Warm-Up Cache
      tags:
      - Cache
  /captcha:
    get:
      description: Get a base64 encoded captcha image or a HTML page to verify for
        user
      operationId: GetCaptcha
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ResponseCaptchaGet'
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                msg:
                  type: string
              type: object
      summary: Get Captcha
      tags:
      - Captcha
  /captcha/status:
    get:
      description: Get the status of the user's captcha verification
      operationId: GetCaptchaStatus
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ResponseCaptchaStatus'
      summary: Get Captcha Status
      tags:
      - Captcha
  /captcha/verify:
    post:
      description: Verify user enters correct captcha code
      operationId: VerifyCaptcha
      parameters:
      - description: The data to check
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/handler.ParamsCaptchaVerify'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Map'
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.Map'
            - properties:
                img_data:
                  type: string
              type: object
      summary: Verify Captcha
      tags:
      - Captcha
  /comments:
    get:
      consumes:
      - application/json
      description: Get a list of comments by some conditions
      operationId: GetComments
      parameters:
      - description: The user email
        in: query
        name: email
        type: string
      - description: Enable flat_mode
        in: query
        name: flat_mode
        type: boolean
      - description: The limit for pagination
        in: query
        name: limit
        type: integer
      - description: The username
        in: query
        name: name
        type: string
      - description: The offset for pagination
        in: query
        name: offset
        type: integer
      - description: The comment page_key
        in: query
        name: page_key
        required: true
        type: string
      - description: The scope of comments
        enum:
        - page
        - user
        - site
        in: query
        name: scope
        type: string
      - description: Search keywords
        in: query
        name: search
        type: string
      - description: The site name of your content scope
        in: query
        name: site_name
        type: string
      - description: Sort by condition
        enum:
        - date_asc
        - date_desc
        - vote
        in: query
        name: sort_by
        type: string
      - description: Return AI assistant comments separately
        in: query
        name: split_ai
        type: boolean
      - description: Message center show type
        enum:
        - all
        - mentions
        - mine
        - pending
        - ai
        in: query
        name: type
        type: string
      - description: Only show comments by admin
        in: query
        name: view_only_admin
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ResponseCommentList'
        "500":
