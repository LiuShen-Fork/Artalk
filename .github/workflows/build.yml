name: Build and Publish
run-name: Build and Publish ${{ inputs.version }} ${{ inputs.dry_run && '(Dry-Run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0"
        type: string
        required: true
      dry_run:
        description: "Dry run"
        type: boolean
        default: false
      build_items:
        description: "Build items: app,docker or ui,app,docker"
        type: string
        default: "app,docker"

  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean
      build_items:
        required: false
        type: string
        default: "app,docker"

permissions:
  contents: write
  id-token: write

jobs:
  tagging:
    uses: ./.github/workflows/build-tagging.yml
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  ui:
    if: inputs.build_items == '' || contains(inputs.build_items, 'ui')
    needs: tagging
    uses: ./.github/workflows/build-ui.yml
    with:
      version: ${{ needs.tagging.outputs.version }}
      ref: ${{ needs.tagging.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  docker:
    if: inputs.build_items == '' || contains(inputs.build_items, 'docker')
    needs: tagging
    uses: ./.github/workflows/build-docker.yml
    strategy:
      matrix:
        target: ["linux/amd64", "linux/amd64,linux/arm64"]
    with:
      version: ${{ needs.tagging.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
      target: ${{ matrix.target }}
    secrets: inherit

  app:
    if: inputs.build_items == '' || contains(inputs.build_items, 'app')
    needs: tagging
    uses: ./.github/workflows/build-app.yml
    with:
      version: ${{ needs.tagging.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  done:
    needs: [tagging, ui, docker, app]
    if: |
      always() &&
      needs.tagging.result == 'success' &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped') &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped') &&
      (needs.app.result == 'success' || needs.app.result == 'skipped')
    uses: ./.github/workflows/build-done.yml
    with:
      version: ${{ needs.tagging.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
