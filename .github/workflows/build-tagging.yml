name: Build Pre Tagging

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean
    outputs:
      version:
        description: "Version"
        value: ${{ jobs.tagging.outputs.version }}

permissions:
  contents: write

jobs:
  tagging:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - name: Validate release version
        run: |
          VERSION="${{ inputs.version }}"

          echo "Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION, expected v1.0.0"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Tag
        run: |
          if [ ! "$(git tag -l "${VERSION}")" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          else
            TAG_SHA="$(git rev-list -n 1 "$VERSION")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "Tag $VERSION already exists but points to $TAG_SHA, current commit is $HEAD_SHA."
              echo "Delete or move the existing tag, or publish a new version."
              exit 1
            fi
            echo "Skip creating tag $VERSION, already exists at current commit."
          fi
